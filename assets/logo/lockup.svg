    <path d="M34 100h52" stroke="#c8912a" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <g font-family="Georgia, 'Cormorant Garamond', serif">
    <text x="170" y="86" font-size="46" font-weight="500" letter-spacing="9.2" fill="#0b3350">AARANYA</text>
    <text x="172" y="112" font-size="12" letter-spacing="5" fill="#0b3350" opacity=".72">SCHOLARLY</text>
