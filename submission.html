<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Details | Aaranya Scholarly</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-base="./">

<!-- Utility bar -->
<div class="utility">
  <div class="wrap">
    <div class="issn"><a class="home-link" href="dashboard.html">← My Dashboard</a></div>
    <div class="social"><a href="#">f</a><a href="#">in</a><a href="#">X</a><a href="#">rg</a></div>
  </div>
</div>

<!-- Brand promise -->
<div class="brand-promise">
  <div class="wrap">
    <span>Open Access</span><span class="sep">&hellip;</span>
    <span>Open Science</span><span class="sep">&hellip;</span>
    <span>Open to All</span><span class="sep">&hellip;</span>
  </div>
</div>

<!-- Header -->
<header class="main">
  <div class="wrap">
    <div class="logo-mark"><img src="assets/logo/mark-reversed.svg" alt="Aaranya Scholarly"></div>
    <div class="title-block">
      <h1 id="pageTitle">Submission Details</h1>
      <div class="meta-line" id="pageMeta">Loading…</div>
    </div>
    <span class="status-chip" id="statusChip" style="display:none;"></span>
  </div>
</header>

<section class="section">
  <div class="wrap" style="max-width:820px;margin:0 auto;">
    <div id="content">
      <div class="empty-state"><div class="icon">⏳</div><h3>Loading submission…</h3></div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <div class="wrap foot-bottom" style="border-top:none;padding-top:0;">
    <span>© 2026 Aaranya Scholarly LLP. All Rights Reserved.</span>
    <div class="foot-social"><a href="#">f</a><a href="#">in</a><a href="#">X</a><a href="#">rg</a></div>
  </div>
</footer>

<script src="assets/auth.js"></script>
<script>
(function(){
  if (!window.AaranyaAuth.requireAuth()) return;

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const content = document.getElementById('content');

  if (!id) {
    content.innerHTML = '<div class="empty-state"><div class="icon">⚠</div><h3>No submission specified</h3><p>Go back to your dashboard and select a submission to view.</p><a class="btn btn-navy" href="dashboard.html">Back to Dashboard</a></div>';
    return;
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function fmtDate(iso){
    return new Date(iso).toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function fmtSize(bytes){
    if (!bytes) return '';
    const kb = bytes / 1024;
    return kb > 1024 ? (kb/1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB';
  }

  async function downloadViaToken(url, filename){
    const res = await window.AaranyaAuth.apiFetch(url);
    if (!res.ok) { alert('Could not download this file.'); return; }
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objUrl;
    link.download = filename || '';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(objUrl);
  }

  function render(s, reviews){
    document.getElementById('pageTitle').textContent = s.title;
    document.getElementById('pageMeta').textContent = s.journalName + ' · ' + s.articleType + ' · Submitted ' + fmtDate(s.submittedAt);
    const chip = document.getElementById('statusChip');
    chip.textContent = s.status;
    chip.style.display = 'inline-block';

    // Anything the editorial office is waiting on from you goes at the very
    // top, before the record of what you already sent.
    let html = '<div id="workflowFiles"></div>';

    // Revision request comes first -- it's the one thing on this page that
    // needs the author to act.
    if (s.awaitingRevision) {
      html += '<div class="panel" style="border-left:3px solid var(--gold);">' +
        '<h3>Revisions Requested</h3>' +
        '<p class="panel-sub">The editor has asked for revisions to this manuscript. Upload your revised file below — ' +
        'it goes to the editor' + (s.currentRound ? ' for round ' + s.currentRound : '') + '.</p>' +
        '<div class="form-row"><label for="revFile">Revised manuscript (PDF or Word) <span style="color:#a12626;">*</span></label>' +
        '<input type="file" id="revFile" accept=".pdf,.doc,.docx"></div>' +
        '<div class="form-row"><label for="revNote">Response to reviewers (optional)</label>' +
        '<textarea id="revNote" placeholder="Briefly summarise how you addressed the reviewers\' comments."></textarea></div>' +
        '<div class="form-alert" id="revAlert"></div>' +
        '<button class="btn btn-gold" id="revSubmit">Upload Revision</button>' +
        '</div>';
    }

    // Reviewer feedback, once any review is complete. Anonymous by design --
    // the API never sends the reviewer's identity to the author.
    if (reviews && reviews.length) {
      const byRound = {};
      reviews.forEach(function(r){ (byRound[r.round] = byRound[r.round] || []).push(r); });
      let rHtml = '';
      Object.keys(byRound).sort().forEach(function(round){
        rHtml += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin:14px 0 8px;">Review Round ' + escapeHtml(round) + '</div>';
        byRound[round].forEach(function(r, i){
          rHtml += '<div class="review-card">' +
            '<div class="rc-head"><span class="rc-who">Reviewer ' + (i+1) + '</span>' +
            '<span class="rec-chip ' + escapeHtml(r.recommendation) + '">' + escapeHtml(r.recommendationLabel) + '</span></div>' +
            '<div class="rc-body">' + escapeHtml(r.commentsForAuthor) + '</div>' +
            '</div>';
        });
      });
      html += '<div class="panel"><h3>Reviewer Feedback</h3>' +
        '<p class="panel-sub">Reviews are anonymous — reviewer identities are not disclosed to authors.</p>' +
        rHtml + '</div>';
    }

    html += '<div class="review-block"><h4>Manuscript</h4><dl>' +
      '<dt>Title</dt><dd>' + escapeHtml(s.title) + '</dd>' +
      '<dt>Journal</dt><dd>' + escapeHtml(s.journalName) + '</dd>' +
      '<dt>Article Type</dt><dd>' + escapeHtml(s.articleType) + '</dd>' +
      (s.subjectArea ? '<dt>Subject Area</dt><dd>' + escapeHtml(s.subjectArea) + '</dd>' : '') +
      '<dt>Abstract</dt><dd>' + escapeHtml(s.abstract) + '</dd>' +
      (s.keywords ? '<dt>Keywords</dt><dd>' + escapeHtml(s.keywords) + '</dd>' : '') +
      '</dl></div>';

    let authorsHtml = '<dt>Corresponding Author</dt><dd>' + escapeHtml(s.correspondingAuthor.name) + ' — ' + escapeHtml(s.correspondingAuthor.email) +
      (s.correspondingAuthor.affiliation ? ' (' + escapeHtml(s.correspondingAuthor.affiliation) + ')' : '') + '</dd>';
    if (s.coAuthorsList && s.coAuthorsList.length) {
      authorsHtml += '<dt>Co-Authors</dt><dd>' + s.coAuthorsList.map(function(a){
        return escapeHtml(a.name) + (a.email ? ' — ' + escapeHtml(a.email) : '') + (a.affiliation ? ' (' + escapeHtml(a.affiliation) + ')' : '');
      }).join('<br>') + '</dd>';
    }
    html += '<div class="review-block"><h4>Authors</h4><dl>' + authorsHtml + '</dl></div>';

    let filesHtml = '<span class="file-chip" style="cursor:pointer;" id="mainFileChip">📄 ' + escapeHtml(s.manuscript.fileName) + ' (' + fmtSize(s.manuscript.fileSize) + ') — Download</span>';
    (s.supplementaryFiles || []).forEach(function(f, idx){
      filesHtml += '<span class="file-chip supp-chip" style="cursor:pointer;" data-idx="' + idx + '">📎 ' + escapeHtml(f.fileName) + ' (' + fmtSize(f.fileSize) + ') — Download</span>';
    });
    html += '<div class="review-block"><h4>Files</h4><dl><dt>Attachments</dt><dd>' + filesHtml + '</dd>' +
      (s.coverLetter ? '<dt>Cover Letter</dt><dd>' + escapeHtml(s.coverLetter) + '</dd>' : '') +
      '</dl></div>';

    let reviewersHtml = (s.suggestedReviewers && s.suggestedReviewers.length)
      ? s.suggestedReviewers.map(function(r){ return escapeHtml(r.name) + (r.email ? ' — ' + escapeHtml(r.email) : ''); }).join('<br>')
      : '—';
    html += '<div class="review-block"><h4>Declarations</h4><dl>' +
      '<dt>Originality Confirmed</dt><dd>' + (s.declarations.originality ? 'Yes' : 'No') + '</dd>' +
      '<dt>Ethics Compliance Confirmed</dt><dd>' + (s.declarations.ethicsCompliance ? 'Yes' : 'No') + '</dd>' +
      (s.declarations.ethicsApprovalDetails ? '<dt>Ethical Approval</dt><dd>' + escapeHtml(s.declarations.ethicsApprovalDetails) + '</dd>' : '') +
      '<dt>Conflict of Interest</dt><dd>' + escapeHtml(s.declarations.conflictOfInterest) + '</dd>' +
      '<dt>Suggested Reviewers</dt><dd>' + reviewersHtml + '</dd>' +
      '</dl></div>';

    if ((s.revisions || []).length) {
      html += '<div class="review-block"><h4>Revisions You Submitted</h4><dl><dt>Files</dt><dd>' +
        s.revisions.map(function(r, idx){
          return '<span class="file-chip rev-chip" style="cursor:pointer;" data-idx="' + idx + '">📄 Round ' + r.round + ' — ' +
            escapeHtml(r.file.fileName) + ' (' + fmtSize(r.file.fileSize) + ') — Download</span>' +
            (r.note ? '<div class="snote" style="margin-top:4px;">' + escapeHtml(r.note) + '</div>' : '');
        }).join('') + '</dd></dl></div>';
    }

    let timelineHtml = (s.statusHistory || []).slice().reverse().map(function(h){
      return '<li><div class="dot"></div><div><div class="swhen">' + fmtDate(h.at) + '</div><div class="swhat">' + escapeHtml(h.status) + '</div>' +
        (h.note ? '<div class="snote">' + escapeHtml(h.note) + '</div>' : '') + '</div></li>';
    }).join('');
    html += '<div class="review-block"><h4>Status Timeline</h4><ul class="status-timeline">' + timelineHtml + '</ul></div>';

    content.innerHTML = html;

    document.getElementById('mainFileChip').addEventListener('click', function(){
      downloadViaToken('/api/submissions/' + s.id + '/file', s.manuscript.fileName);
    });
    content.querySelectorAll('.supp-chip').forEach(function(chipEl){
      chipEl.addEventListener('click', function(){
        const idx = chipEl.getAttribute('data-idx');
        const f = s.supplementaryFiles[idx];
        downloadViaToken('/api/submissions/' + s.id + '/supplementary/' + idx, f.fileName);
      });
    });
    content.querySelectorAll('.rev-chip').forEach(function(chipEl){
      chipEl.addEventListener('click', function(){
        const idx = chipEl.getAttribute('data-idx');
        downloadViaToken('/api/submissions/' + s.id + '/revision/' + idx, s.revisions[idx].file.fileName);
      });
    });

    const revBtn = document.getElementById('revSubmit');
    if (revBtn) revBtn.addEventListener('click', function(){ uploadRevision(s.id); });

    loadWorkflowFiles(s);
  }

  // ---- Copyediting and proofing ----
  //
  // Only ever shows files the API marked visible to the author; the editor's
  // internal working copies live on the same record and never arrive here.
  async function loadWorkflowFiles(s){
    const box = document.getElementById('workflowFiles');
    if (!box) return;

    let data;
    try {
      const res = await window.AaranyaAuth.apiFetch('/api/submissions/' + s.id + '/workflow-files');
      if (!res.ok) return;
      data = await res.json();
    } catch(e){ return; }

    const files = data.files || [];
    const kinds = data.uploadableKinds || [];
    if (!files.length && !kinds.length) return;

    const pending = files.filter(function(f){ return f.needsAuthorAction && !f.answeredAt; });

    let html = '<div class="panel"' + (pending.length ? ' style="border-left:3px solid var(--gold);"' : '') + '>' +
      '<h3>Copyediting &amp; Proofs</h3>' +
      '<p class="panel-sub">' +
        (pending.length
          ? 'The editorial office is waiting on your response to the file' + (pending.length > 1 ? 's' : '') + ' below.'
          : 'Files exchanged with the editorial office while your article is prepared for publication.') +
      '</p>';

    if (files.length){
      html += files.map(function(f){
        const mine = f.uploadedBy === 'You';
        const flag = f.needsAuthorAction && !f.answeredAt
          ? '<span class="status-chip" style="background:#fdeeee;color:#a12626;">Your response needed</span>'
          : (f.needsAuthorAction ? '<span class="status-chip" style="background:#eef7f3;color:#1c6b4f;">Answered</span>' : '');
        return '<div class="review-card">' +
          '<div class="rc-head">' +
            '<div><span class="rc-who">' + escapeHtml(f.kindLabel) + '</span>' +
              '<div class="rc-meta">' + escapeHtml(f.uploadedBy) + ' · ' + fmtDate(f.uploadedAt) + '</div></div>' +
            '<div style="text-align:right;">' + flag + '</div>' +
          '</div>' +
          (f.note ? '<div class="rc-body" style="margin-top:8px;">' + escapeHtml(f.note) + '</div>' : '') +
          '<div style="margin-top:10px;">' +
            '<span class="file-chip wf-chip" style="cursor:pointer;" data-fid="' + escapeHtml(f.id) + '" data-fname="' + escapeHtml(f.fileName) + '">' +
            (mine ? '📄 ' : '📥 ') + escapeHtml(f.fileName) +
            (f.fileSize ? ' (' + fmtSize(f.fileSize) + ')' : '') + ' — Download</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    if (kinds.length){
      html += '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px;">' +
        '<div class="form-row"><label for="wfKind">Send a file to the editorial office</label><select id="wfKind">' +
          kinds.map(function(k){ return '<option value="' + escapeHtml(k.key) + '">' + escapeHtml(k.label) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-row"><label for="wfFile">File (PDF or Word)</label><input type="file" id="wfFile" accept=".pdf,.doc,.docx"></div>' +
        '<div class="form-row"><label for="wfNote">Note (optional)</label>' +
        '<textarea id="wfNote" placeholder="Anything the editor should know about the changes."></textarea></div>' +
        '<div class="form-alert" id="wfAlert"></div>' +
        '<button class="btn btn-gold" id="wfSubmit">Upload</button>' +
      '</div>';
    }

    box.innerHTML = html + '</div>';

    box.querySelectorAll('.wf-chip').forEach(function(chipEl){
      chipEl.addEventListener('click', function(){
        downloadViaToken(
          '/api/submissions/' + s.id + '/workflow-files/' + chipEl.getAttribute('data-fid'),
          chipEl.getAttribute('data-fname')
        );
      });
    });

    const btn = document.getElementById('wfSubmit');
    if (btn){
      btn.addEventListener('click', async function(){
        const alertEl = document.getElementById('wfAlert');
        const fileInput = document.getElementById('wfFile');
        if (!fileInput.files[0]){
          alertEl.textContent = 'Choose a file to upload.';
          alertEl.className = 'form-alert error show';
          return;
        }
        const fd = new FormData();
        fd.append('file', fileInput.files[0]);
        fd.append('kind', document.getElementById('wfKind').value);
        fd.append('note', document.getElementById('wfNote').value || '');

        btn.disabled = true; btn.textContent = 'Uploading…';
        const res = await window.AaranyaAuth.apiFetch('/api/submissions/' + s.id + '/workflow-files', { method:'POST', body: fd });
        btn.disabled = false; btn.textContent = 'Upload';
        if (!res.ok){
          const e = await res.json().catch(function(){ return {}; });
          alertEl.textContent = e.error || 'Could not upload that file.';
          alertEl.className = 'form-alert error show';
          return;
        }
        loadWorkflowFiles(s);
      });
    }
  }

  async function uploadRevision(subId){
    const alertEl = document.getElementById('revAlert');
    const fileInput = document.getElementById('revFile');
    const btn = document.getElementById('revSubmit');

    function fail(msg){
      alertEl.textContent = msg;
      alertEl.className = 'form-alert error show';
    }
    if (!fileInput.files[0]) { fail('Choose your revised manuscript file.'); return; }

    const fd = new FormData();
    fd.append('manuscript', fileInput.files[0]);
    fd.append('note', document.getElementById('revNote').value || '');

    btn.disabled = true; btn.textContent = 'Uploading…';
    const res = await window.AaranyaAuth.apiFetch('/api/submissions/' + subId + '/revision', { method:'POST', body: fd });
    btn.disabled = false; btn.textContent = 'Upload Revision';

    if (!res.ok) {
      const e = await res.json().catch(function(){ return {}; });
      fail(e.error || 'Could not upload your revision.');
      return;
    }
    load();
  }

  function load(){
    return window.AaranyaAuth.apiFetch('/api/submissions/' + encodeURIComponent(id)).then(function(res){
    if (!res.ok) {
      content.innerHTML = '<div class="empty-state"><div class="icon">⚠</div><h3>Submission not found</h3><p>It may have been removed, or you may not have access to it.</p><a class="btn btn-navy" href="dashboard.html">Back to Dashboard</a></div>';
      return;
    }
    return res.json().then(function(data){ render(data.submission, data.reviews || []); });
  }).catch(function(){
    content.innerHTML = '<div class="empty-state"><div class="icon">⚠</div><h3>Could not load submission</h3><p>Check that the site is running with "npm start" and try refreshing.</p></div>';
    });
  }

  load();
})();
</script>
</body>
</html>
